<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F89820"/>
      <stop offset="1" stop-color="#61DAFB"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2A44" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes flow { to { stroke-dashoffset: -24 } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .wire { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity=".6"/>

  <!-- Left: name and title -->
  <text x="64" y="118" class="sans" font-size="20" fill="#8FA3BF" letter-spacing="3">HI, I'M</text>
  <text x="64" y="170" class="sans" font-size="48" font-weight="700" fill="#FFFFFF">Suraj Vishnu Dombale</text>
  <rect x="64" y="190" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="230" class="sans" font-size="22" fill="#C9D6E8">Full Stack Developer · 5 Years</text>
  <text x="64" y="264" class="mono" font-size="16" fill="#61DAFB">Java · Spring Boot · React · MySQL · Docker</text>

  <!-- Right: full stack architecture -->
  <g class="sans" font-size="15" font-weight="600">
    <!-- React -->
    <rect x="760" y="44" width="170" height="52" rx="10" fill="#0F1A2E" stroke="#61DAFB" stroke-width="2"/>
    <text x="845" y="76" text-anchor="middle" fill="#61DAFB">React UI</text>

    <!-- Spring Boot -->
    <rect x="760" y="134" width="170" height="52" rx="10" fill="#0F1A2E" stroke="#6DB33F" stroke-width="2"/>
    <text x="845" y="166" text-anchor="middle" fill="#6DB33F">Spring Boot API</text>

    <!-- MySQL -->
    <rect x="760" y="224" width="170" height="52" rx="10" fill="#0F1A2E" stroke="#F89820" stroke-width="2"/>
    <text x="845" y="256" text-anchor="middle" fill="#F89820">MySQL</text>

    <!-- Stripe -->
    <rect x="990" y="88" width="150" height="52" rx="10" fill="#0F1A2E" stroke="#8B7BFF" stroke-width="2"/>
    <text x="1065" y="120" text-anchor="middle" fill="#A99CFF">Stripe</text>

    <!-- PLC / OPC UA -->
    <rect x="990" y="180" width="150" height="52" rx="10" fill="#0F1A2E" stroke="#4CAF50" stroke-width="2"/>
    <text x="1065" y="204" text-anchor="middle" fill="#7CD67F">PLC</text>
    <text x="1065" y="222" text-anchor="middle" fill="#7CD67F" font-size="11" font-weight="400">via OPC UA</text>
  </g>

  <!-- Connections -->
  <g fill="none" stroke-width="2">
    <line x1="845" y1="96" x2="845" y2="134" stroke="#61DAFB" class="wire"/>
    <line x1="845" y1="186" x2="845" y2="224" stroke="#6DB33F" class="wire"/>
    <path d="M930 150 H960 V114 H990" stroke="#8B7BFF" class="wire"/>
    <path d="M930 170 H960 V206 H990" stroke="#4CAF50" class="wire"/>
  </g>

  <!-- Circuit accents (electrical background) -->
  <g fill="#4CAF50">
    <circle cx="960" cy="114" r="4" class="dot"/>
    <circle cx="960" cy="206" r="4" class="dot" style="animation-delay:1.2s"/>
  </g>

  <!-- Small code tag -->
  <text x="1140" y="296" text-anchor="end" class="mono" font-size="14" fill="#3D5275">&lt;/&gt; building web &amp; industrial software</text>
</svg>
